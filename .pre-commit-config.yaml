# Optional local guard: catch a token that leaked once before it is committed
# again (e.g. from a clone that still holds the old history).  CI enforces the
# same check regardless.  Enable on each machine with:
#
#   pip install pre-commit && pre-commit install
#
repos:
  - repo: local
    hooks:
      - id: pii-guard
        name: PII guard (no leaked tokens)
        entry: python tools/check_pii.py
        language: system
        types: [text]
        pass_filenames: true
